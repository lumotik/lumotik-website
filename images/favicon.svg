  <path d="M 202 422 H 90 V 310" stroke="#00FFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <path d="M 180 135 V 372 H 360" stroke="url(#lumotik-fav-grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-fav)" />

  <path d="M 120 392 L 392 120" stroke="url(#beam-fav-grad)" stroke-width="26" stroke-linecap="round" />
  <circle cx="392" cy="120" r="24" fill="#FFFFFF" filter="url(#glow-fav)" />
  <circle cx="392" cy="120" r="15" fill="#00FFFF" />
