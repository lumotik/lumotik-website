<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lumotik-fav-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#1CBDFF" />
    </linearGradient>
    <linearGradient id="beam-fav-grad" x1="80" y1="432" x2="432" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00FFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" />
