<svg width="220" height="52" viewBox="0 0 220 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan to Cobalt Gradient -->
    <linearGradient id="lumotik-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#1CBDFF" />
    </linearGradient>
    <linearGradient id="beam-grad" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00FFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-10" y="-10" width="68" height="68" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Mark / Icon Box -->
  <g transform="translate(2, 2)">
    <!-- Ambient dark rounded badge background -->
    <rect width="48" height="48" rx="12" fill="#0D1515" stroke="rgba(0, 255, 255, 0.2)" stroke-width="1.5" />
    
    <!-- Top-Right Focus Bracket -->
    <path d="M 30 10 H 38 V 18" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Bottom-Left Focus Bracket -->
    <path d="M 18 38 H 10 V 30" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

    <!-- Center Geometric "L" with Dynamic Beam -->
    <!-- L Vertical Stem -->
    <path d="M 17 14 V 34 H 33" stroke="url(#lumotik-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Dynamic Photonic Ray Through Center -->
    <path d="M 12 36 L 36 12" stroke="url(#beam-grad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="36" cy="12" r="2" fill="#FFFFFF" />
  </g>

  <!-- Brand Wordmark Typography: Lumotik -->
  <g transform="translate(62, 34)">
    <text font-family="'Sora', 'Inter', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
      Lumo<tspan fill="#00FFFF">tik</tspan>
    </text>
    <!-- Subtle digital badge dot -->
    <circle cx="106" cy="-8" r="3.5" fill="#00FFFF" />
  </g>
</svg>
